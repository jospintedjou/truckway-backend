# Test on every push and pull request; deploy to the server on pushes to main/master.
# Deploy = SSH to the server, pull the code, rebuild the containers. Secrets stay in the server's .env.
name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SECRET_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            [ -n "$DEPLOY_PATH" ] || { echo "The DEPLOY_PATH secret is empty"; exit 1; }
            cd "$DEPLOY_PATH"
            git rev-parse --git-dir >/dev/null 2>&1 || { echo "$DEPLOY_PATH is not a git clone of this repo"; exit 1; }
            # mirror GitHub exactly (works after a force-push; .env is untracked and stays)
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose --profile prod up -d --build
            docker image prune -f
            # wait for the API to answer before calling the deploy a success
            for i in $(seq 1 20); do
              curl -fsS http://localhost:${API_PORT:-8021}/api/health && exit 0
              sleep 3
            done
            echo "API did not become healthy" && docker compose --profile prod logs --tail 50 prod && exit 1
