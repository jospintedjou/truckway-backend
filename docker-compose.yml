# Production:  docker compose --profile prod up -d --build
# Development: docker compose --profile dev up --build      (auto-reload on code changes)
# Tests:       docker compose --profile dev run --rm dev pytest

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  prod:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8021}:8000"
    depends_on:
      - redis

  dev:
    profiles: ["dev"]
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
